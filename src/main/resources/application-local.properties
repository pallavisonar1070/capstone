# --- DataSource: H2 in-memory (MySQL compatibility) ---
spring.datasource.url=jdbc:h2:mem:capstone;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA/Hibernate ---
# Let Hibernate build/update schema from entities (since Flyway is removed)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console (optional) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Safety: make sure nothing tries to hit MySQL
spring.sql.init.mode=never
